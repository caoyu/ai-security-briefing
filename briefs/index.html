<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Security Briefing - 安全简报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .hero {
            padding: 100px 20px;
            text-align: center;
            background: radial-gradient(ellipse at top, rgba(94, 129, 244, 0.3) 0%, transparent 70%);
        }
        
        .hero h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #5e81f4, #a855f7, #5e81f4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(10deg); }
        }
        
        .hero p {
            font-size: 1.3em;
            color: #a5b4fc;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(94, 129, 244, 0.3);
        }
        
        .feature-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        .feature-card h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #5e81f4;
        }
        
        .feature-card p {
            color: #a5b4fc;
            line-height: 1.7;
        }
        
        .cta-section {
            text-align: center;
            margin-top: 80px;
            padding: 60px 20px;
        }
        
        .cta-button {
            display: inline-block;
            padding: 18px 50px;
            background: linear-gradient(135deg, #5e81f4 0%, #a855f7 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(94, 129, 244, 0.4);
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(94, 129, 244, 0.6);
        }
        
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 60px;
        }
        
        .footer a {
            color: #5e81f4;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5em;
            }
            
            .hero p {
                font-size: 1.1em;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🛡️ AI Security Briefing</h1>
        <p>每日 AI 安全情报速递 · 追踪最新安全动态 · 守护您的数字资产</p>
    </div>
    
    <div class="container">
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">📊</div>
                <h3>智能简报</h3>
                <p>每日自动汇总 AI 安全领域最新动态，从漏洞披露到威胁情报，一目了然。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">🔍</div>
                <h3>深度分析</h3>
                <p>不仅仅是新闻聚合，更提供专业视角的深度解读和风险评估。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <h3>实时推送</h3>
                <p>关键安全事件第一时间推送，让您始终领先威胁一步。</p>
            </div>
        </div>
        
        <div class="cta-section">
            <a href="https://github.com/caoyu/ai-security-briefing" class="cta-button">
                访问 GitHub 仓库 →
            </a>
        </div>
    </div>
    
    <div class="footer">
        <p>© 2026 AI Security Briefing. Built with ❤️ for the security community.</p>
        <p>Powered by <a href="https://github.com/caoyu/ai-security-briefing">GitHub Pages</a></p>
    </div>
</body>
</html>
